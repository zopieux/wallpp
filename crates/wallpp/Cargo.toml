[package]
name = "wallpp"
version = "0.1.0"
edition = "2021"

[features]
# Sandbox-only: route provider HTTP through the HTTP(S)_PROXY egress
# proxy and trust the OS certificate store (the sandbox proxy MITMs
# TLS). Normal builds neither compile nor use any of this.
sandbox-proxy = [
    "dep:hyper",
    "dep:http",
    "dep:http-body-util",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "dep:webpki-roots",
]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
wasmtime = { version = "38", features = ["component-model"] }
wasmtime-wasi = "38"
wasmtime-wasi-http = "38"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
config = { version = "0.15", default-features = false, features = ["toml"] }
bincode = "1.3"
display-info = "0.5.9"
humantime = "2.1"
humantime-serde = "1.1"
# Direct deps (already transitive via wasmtime-wasi-http) for the
# proxy-aware outgoing handler in http_proxy.rs. Only compiled with
# the `sandbox-proxy` feature.
hyper = { version = "1", features = ["full"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.22", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.25", optional = true }
webpki-roots = { version = "0.26", optional = true }

